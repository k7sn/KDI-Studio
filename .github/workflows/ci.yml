name: Build KDIStudios (Windows)

on:
  push:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Build KDIStudios-Setup.exe (Windows)
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Build release
        run: cargo build -p poni --release

      - name: Build Installer (Inno Setup)
        shell: pwsh
        run: |
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup -y --no-progress
          }
          & $iscc installer\poni.iss

      - name: Upload KDIStudios-Setup.exe
        uses: actions/upload-artifact@v4
        with:
          name: KDIStudios-Setup
          path: dist/KDIStudios-Setup.exe
          if-no-files-found: error
