name: Build KDI Studio (Windows)

on:
  push:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Build poni.exe (Windows)
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Build release
        run: cargo build -p poni --release

      - name: Upload KDI-Studio.exe
        uses: actions/upload-artifact@v4
        with:
          name: KDI-Studio-Windows
          path: target/release/poni.exe
          if-no-files-found: error
